name: PR gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  integration:
    # Affected-integration tier (eng/QUALITY_GATES.md): real SQL Server via
    # Testcontainers, kept out of the fast gate job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: SQL Server provider tests
        run: dotnet test tests/Forge.Persistence.SqlServer.Tests -c Release
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: ReferenceCatalog slice tests
        run: dotnet test tests/Forge.ReferenceCatalog.Tests -c Release
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: Identity module tests
        run: dotnet test tests/Forge.SecurityTests -c Release --filter "FullyQualifiedName~IdentityModuleTests"
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: Quartz SQL store tests
        run: dotnet test tests/Forge.JobsTests -c Release --filter "FullyQualifiedName~QuartzSqlStoreTests"
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: Settings SQL store tests
        run: dotnet test tests/Forge.SettingsTests -c Release --filter "FullyQualifiedName~SqlSettingStoreTests"
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: Redis cache tests
        run: dotnet test tests/Forge.CachingTests -c Release
        env:
          FORGE_REQUIRE_SQLSERVER: "true"
      - name: forge new output builds against packed Forge
        run: |
          FEED=$RUNNER_TEMP/forge-feed
          mkdir -p $FEED
          dotnet build Forge.slnx -c Release --verbosity quiet
          for proj in Forge.Core Forge.Modularity Forge.Tenancy Forge.Events Forge.Auditing Forge.Settings Forge.Web Forge.Observability Forge.Persistence.SqlServer Forge.Security Forge.Identity Forge.Jobs Forge.Localization Forge.Admin.Blazor; do
            dotnet pack src/$proj -c Release -o $FEED --no-build --verbosity quiet
          done
          for variant in "" "--admin"; do
            GEN=$RUNNER_TEMP/gen$variant
            dotnet run --project src/Forge.Cli -c Release --no-build -- new Acme --root $GEN $variant
            printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration><packageSources><add key="forge-local" value="%s" /></packageSources></configuration>\n' "$FEED" > $GEN/Acme/nuget.config
            dotnet build $GEN/Acme/Acme.slnx --verbosity quiet
            dotnet run --project src/Forge.Cli -c Release --no-build -- modules validate --root $GEN/Acme
          done
      - name: OCI container smoke (fresh install, no Aspire)
        run: |
          docker run -d --name smoke-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD='Smoke!Passw0rd42' -p 14433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do docker exec smoke-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Smoke!Passw0rd42' -C -Q "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          docker exec smoke-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Smoke!Passw0rd42' -C -Q "CREATE DATABASE forge"
          export ConnectionStrings__forge="Server=127.0.0.1,14433;Database=forge;User Id=sa;Password=Smoke!Passw0rd42;TrustServerCertificate=true"
          dotnet run --project samples/Forge.ReferenceSaaS.DbMigrator -c Release -- migrate
          dotnet publish samples/Forge.ReferenceSaaS.Api -t:PublishContainer -c Release --verbosity quiet
          # production-shaped smoke: persisted token key material is mandatory in Production
          KEYS=$RUNNER_TEMP/forge-keys
          mkdir -p $KEYS
          openssl req -x509 -newkey rsa:2048 -keyout $KEYS/sign.key -out $KEYS/sign.crt -days 2 -nodes -subj "/CN=smoke-signing"
          openssl pkcs12 -export -out $KEYS/signing.pfx -inkey $KEYS/sign.key -in $KEYS/sign.crt -passout pass:smokepwd
          openssl req -x509 -newkey rsa:2048 -keyout $KEYS/enc.key -out $KEYS/enc.crt -days 2 -nodes -subj "/CN=smoke-encryption"
          openssl pkcs12 -export -out $KEYS/encryption.pfx -inkey $KEYS/enc.key -in $KEYS/enc.crt -passout pass:smokepwd
          chmod 644 $KEYS/*.pfx  # the container runs as non-root app; a real bind mount enforces file modes
          docker run -d --name smoke-api --add-host=host.docker.internal:host-gateway -p 5230:8080 -v $KEYS:/keys:ro -e ConnectionStrings__forge="Server=host.docker.internal,14433;Database=forge;User Id=sa;Password=Smoke!Passw0rd42;TrustServerCertificate=true" -e Identity__SigningCertificate__PfxPath=/keys/signing.pfx -e Identity__SigningCertificate__PasswordEnvironmentVariable=FORGE_PFX_PWD -e Identity__EncryptionCertificate__PfxPath=/keys/encryption.pfx -e Identity__EncryptionCertificate__PasswordEnvironmentVariable=FORGE_PFX_PWD -e FORGE_PFX_PWD=smokepwd forge/referencesaas-api:latest
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5230/healthz/live && break; sleep 2; done
          curl -sf http://127.0.0.1:5230/healthz/live || { echo "== container logs =="; docker logs smoke-api; exit 1; }
          curl -sf --max-time 60 http://127.0.0.1:5230/healthz/ready
          test "$(docker exec smoke-api whoami)" = "app"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5230/api/catalog/items/ -H "X-Tenant: smoke" -H "Content-Type: application/json" -d '{"name":"Smoke Anvil"}')
          test "$code" = "201"

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build accessibility tests
        run: dotnet build tests/Forge.AccessibilityTests -c Release
      - name: Install Playwright browsers
        run: pwsh tests/Forge.AccessibilityTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps
      - name: WCAG 2.2 AA gate
        run: dotnet test tests/Forge.AccessibilityTests -c Release --no-build
        env:
          FORGE_REQUIRE_SQLSERVER: "true"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Secret scan
        # pinned binary + full-history scan: the action's push-range logic breaks
        # on pushes containing the root commit
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1 .

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Forge.slnx

      - name: Build (warnings as errors, deterministic)
        run: dotnet build Forge.slnx --no-restore -c Release

      - name: Format
        run: dotnet format Forge.slnx --verify-no-changes --no-restore

      - name: Tests (unit + architecture + tenancy invariants)
        run: dotnet test Forge.slnx --no-build -c Release --filter "FullyQualifiedName!~Persistence.SqlServer.Tests&FullyQualifiedName!~ReferenceCatalog.Tests&FullyQualifiedName!~IdentityModuleTests&FullyQualifiedName!~QuartzSqlStoreTests&FullyQualifiedName!~SqlSettingStoreTests&FullyQualifiedName!~RedisTenantCacheTests&FullyQualifiedName!~AccessibilityTests"

      - name: Vulnerability scan
        run: |
          dotnet list Forge.slnx package --vulnerable --include-transitive | tee vulns.txt
          ! grep -q "has the following vulnerable packages" vulns.txt

      - name: SBOM
        run: dotnet tool run dotnet-CycloneDX -- Forge.slnx --json --output artifacts --filename sbom.json

      - name: Licence scan (SBOM allowlist)
        run: |
          jq -r '.components[]? | "\(.name)\t\([.licenses[]?.license.id // empty] | join(","))"' artifacts/sbom.json | tee licences.txt
          # allowlist per eng/dependency-policy.md; empty licence field is flagged for manual review.
          # Reviewed exceptions (recorded in eng/dependency-policy.md) are filtered out first.
          awk -F'\t' '
            $1 == "Microsoft.Data.SqlClient.SNI.runtime" { next }
            $1 == "Microsoft.Identity.Client.NativeInterop" { next }
            $1 == "Fractions" { next }
            $1 == "Json.More.Net" { next }
            $1 == "JsonPatch.Net" { next }
            $1 == "JsonPointer.Net" { next }
            $2 !~ /^(Apache-2\.0|MIT|BSD-2-Clause|BSD-3-Clause|ISC|MS-PL|Unlicense|CC0-1\.0|MPL-2\.0)(,(Apache-2\.0|MIT|BSD-2-Clause|BSD-3-Clause|ISC|MS-PL|Unlicense|CC0-1\.0|MPL-2\.0))*$/ { print "DISALLOWED: " $0; found=1 }
            END { exit found }' licences.txt

      - name: Quality gate summary
        if: always()
        run: |
          {
            echo "## PR quality gate"
            echo "Per eng/QUALITY_GATES.md: build, format, tests, secret/vulnerability/licence scans, SBOM."
            echo '```'
            tail -5 vulns.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-gate-artefacts
          path: |
            artifacts/sbom.json
            licences.txt
            vulns.txt
          retention-days: 30
